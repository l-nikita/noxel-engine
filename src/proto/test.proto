syntax = "proto3";

message ChatMessage {
  string username = 1;
  string message = 2;
  int32 timestamp = 3;
}

message PlayerPosition {
  string username = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

message GameEvent {
  int32 event_id = 1;
  string description = 2;
}

message NetworkMessage {
  oneof payload {
    ChatMessage chat = 1;
    PlayerPosition position = 2;
    GameEvent event = 3;
  }
}
